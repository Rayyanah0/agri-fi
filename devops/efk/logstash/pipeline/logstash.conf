# Agri-Fi Logstash pipeline (#1236)
#
# Ships and parses application logs into Elasticsearch. Ingest is exposed over
# Beats (Filebeat sidecars) and plain JSON-over-TCP, so it works both for
# Kubernetes sidecars and legacy hosts. Records land on the `agri-fi-logs`
# ILM rollover alias defined in devops/efk/index-template.json.

input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
    tags => ["json-tcp"]
  }
}

filter {
  # Normalise the timestamp emitted by the NestJS pino logger.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  } else if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Parse Kubernetes container lines that wrap the app JSON under `log`.
  if [log] and [log] =~ /^\{/ {
    json {
      source => "log"
      target => "app"
      skip_on_invalid_json => true
    }
    mutate {
      rename => {
        "[app][msg]" => "msg"
        "[app][level]" => "level"
        "[app][context]" => "context"
        "[app][traceId]" => "traceId"
        "[app][correlationId]" => "correlationId"
        "[app][req]" => "req"
        "[app][res]" => "res"
      }
    }
  }

  # Static metadata for every record.
  mutate {
    add_field => {
      "environment" => "${LOG_ENVIRONMENT:development}"
      "service" => "%{[kubernetes][labels][app]}"
    }
    rename => { "fluentd_tag" => "fluentd_tag" }
  }

  if [service] == "" or ![service] {
    mutate { replace => { "service" => "agri-fi-backend" } }
  }

  # Promote identifiers used for correlation and cost analytics.
  if ![correlationId] {
    mutate {
      add_field => { "correlationId" => "%{[traceId]}" }
    }
  }
  if ![status] and [res][statusCode] {
    mutate { add_field => { "status" => "%{[res][statusCode]}" } }
  }

  # Drop health-check noise.
  if [req][url] =~ /^\/(health|healthz|metrics|favicon\.ico)/ {
    drop {}
  }

  # Coerce numeric fields.
  mutate {
    convert => {
      "[res][statusCode]" => "integer"
      "[durationMs]" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    scheme => "${ELASTICSEARCH_SCHEME:http}"
    user => "${ELASTICSEARCH_USER:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
    index => "agri-fi-logs"
    ilm_enabled => true
    ilm_rollover_alias => "agri-fi-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "agri-fi-logs-retention"
    manage_template => false
  }
}
