<!--
  Fluentd shipper for Agri-Fi centralised logging (#1236).

  Tails container logs, parses the JSON emitted by the NestJS pino logger,
  enriches every record with service/environment metadata, and ships to
  Elasticsearch through the `agri-fi-logs` ILM rollover alias.
-->
<source>
  @type tail
  path /var/log/containers/*.log
  pos_file /fluentd/log/containers.log.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type json
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

<!-- Records nested under `log` (raw container line) are JSON too. -->
<filter kubernetes.**>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</filter>

<!-- Normalise fields and promote the correlation/trace identifiers. -->
<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    environment ${ENV['LOG_ENVIRONMENT'] || 'development'}
    service ${record.dig('kubernetes', 'labels', 'app') || record['service'] || 'agri-fi-backend'}
    @timestamp ${record['timestamp'] || Time.now.utc.iso8601}
    correlationId ${record['correlationId'] || record.dig('req', 'correlationId') || record['traceId'] || record.dig('req', 'traceId') || 'N/A'}
    traceId ${record['traceId'] || record.dig('req', 'traceId') || 'N/A'}
    userId ${record['userId'] || 'N/A'}
    txHash ${record['txHash'] || 'N/A'}
    operation ${record['operation'] || 'N/A'}
    durationMs ${record['durationMs'] || 0}
    status ${record.dig('res', 'statusCode') || record['status'] || 'N/A'}
  </record>
</filter>

<!-- Drop noisy health-check access logs before indexing. -->
<filter kubernetes.**>
  @type grep
  <exclude>
    key req.url
    pattern /^\/(health|healthz|metrics|favicon.ico)/
  </exclude>
</filter>

<match kubernetes.**>
  @type elasticsearch
  host "#{ENV['ELASTICSEARCH_HOST'] || 'elasticsearch'}"
  port "#{ENV['ELASTICSEARCH_PORT'] || '9200'}"
  scheme "#{ENV['ELASTICSEARCH_SCHEME'] || 'http'}"
  user "#{ENV['ELASTICSEARCH_USER']}"
  password "#{ENV['ELASTICSEARCH_PASSWORD']}"
  ilm_policy agri-fi-logs-retention
  index_name agri-fi-logs
  include_timestamp true
  include_tag_key true
  tag_key fluentd_tag
  reconnect_on_error true
  reload_on_failure true
  request_timeout 30s
  <buffer>
    @type file
    path /fluentd/log/elasticsearch
    flush_interval 5s
    retry_forever true
  </buffer>
</match>
